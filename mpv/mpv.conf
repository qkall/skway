# --- ORIGINAL UI & GENERAL SETTINGS ---
no-audio-display                 # don't display album art
term-osd-bar                     # show ASCII progress bar
term-osd-bar-chars="╞═╡ │"       # 12223445 (e.g. [===>  ])
use-filedir-conf                 # look for config file in the file's directory
cursor-autohide-fs-only          # don't autohide cursor in windowed mode
cursor-autohide=1000             # autohide the cursor after 1s
prefetch-playlist=yes
force-seekable=yes
hls-bitrate=max                  # use max quality for HLS streams
volume=100

# --- VIDEO QUALITY ---
# Keep your 480p limit to ensure the smallest possible file size for the cache
ytdl-format=bestvideo[height<=?480]+bestaudio/best

# --- EXTREME CACHE & NETWORK OVERRIDE ---
cache=yes
# Massive 4GB RAM allocation (lower to 2048MiB if you have less than 16GB RAM)
demuxer-max-bytes=1024MiB
demuxer-max-back-bytes=1024MiB

# LOOK-AHEAD: Forces mpv to try and buffer 15 minutes of video
demuxer-readahead-secs=90
cache-secs=90

# PREVENT IDLE: Keep the connection open constantly
# This forces the player to keep downloading until the 4GB RAM is full
demuxer-hysteresis-secs=90

# FORCED INITIAL BUFFER: The "Anti-Stutter" wall
# These two lines ensure the video stays PAUSED until a huge chunk is ready
cache-pause=yes
cache-pause-initial=yes
# Wait until 150MB is downloaded before playing (adjust number higher if needed)
cache-pause-wait=5000

# DISK BACKUP: Allow the cache to spill over to your drive
cache-on-disk=yes

# NETWORK TWEAKS: Prevent timeout on slow connections
network-timeout=60
tls-verify=no                    # Skip certificate handshakes that can stall initial buffering
